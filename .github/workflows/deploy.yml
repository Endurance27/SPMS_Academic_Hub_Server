name: Release and Deploy

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
      - amos-dev
  workflow_dispatch:
    inputs:
      version:
        default: latest
        description: Tag you want to release

env:
  BUILD_TAG: ${{ github.event.inputs.version || 'latest' }}

jobs:
