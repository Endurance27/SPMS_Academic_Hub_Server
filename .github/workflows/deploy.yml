  build-and-push:
    name: Build and Push Docker Images
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest

    env:
      GIT_PERSONAL_ACCESS_TOKEN: ${{ secrets.GIT_PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: make build-image

      - name: Push image
        run: make build-image-push

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest

    env:
      # App Configuration
      APP_ENV: production
      DEBUG: false
      LOG_LEVEL: INFO

      # Secrets
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256

      # Database
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Redis
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

      # Celery
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}

      # Email
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      # Mailtrap
      MAILTRAP_API_KEY: ${{ secrets.MAILTRAP_API_KEY }}
      MAILTRAP_SENDER_EMAIL: ${{ secrets.MAILTRAP_SENDER_EMAIL }}
      MAILTRAP_SENDER_NAME: ${{ secrets.MAILTRAP_SENDER_NAME }}

      # 2FA
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}

      # External APIs
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # Security
      BCRYPT_ROUNDS: 12
      SESSION_TIMEOUT_MINUTES: 60
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 30

      # CORS
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}

      # Frontend
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}

      # GitHub Container Registry
      GIT_PERSONAL_ACCESS_TOKEN: ${{ secrets.GIT_PERSONAL_ACCESS_TOKEN }}
      GIT_USERNAME: ${{ secrets.GIT_USERNAME || 'username' }}
      BUILD_IMAGE: ${{ vars.BUILD_IMAGE || 'spms-academic-hub' }}
      BUILD_TAG: ${{ github.event.inputs.version || 'latest' }}

      # Deployment
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production .env file
        run: |
          python3 - <<'PY'
          import os
          keys = [
              "APP_ENV", "DEBUG", "LOG_LEVEL",
              "SECRET_KEY", "JWT_SECRET_KEY", "JWT_ALGORITHM",
              "POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_DB",
              "POSTGRES_HOST", "POSTGRES_PORT", "DATABASE_URL",
              "REDIS_PASSWORD", "REDIS_URL",
              "CELERY_BROKER_URL", "CELERY_RESULT_BACKEND",
              "SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASSWORD", "EMAIL_FROM",
              "MAILTRAP_API_KEY", "MAILTRAP_SENDER_EMAIL", "MAILTRAP_SENDER_NAME",
              "TWILIO_ACCOUNT_SID", "TWILIO_AUTH_TOKEN", "TWILIO_PHONE_NUMBER",
              "GOOGLE_MAPS_API_KEY",
              "BCRYPT_ROUNDS", "SESSION_TIMEOUT_MINUTES",
              "MAX_LOGIN_ATTEMPTS", "LOCKOUT_DURATION_MINUTES",
              "CORS_ORIGINS", "ALLOWED_HOSTS",
              "FRONTEND_URL",
              "GIT_USERNAME", "GIT_PERSONAL_ACCESS_TOKEN",
              "BUILD_IMAGE", "BUILD_TAG",
          ]
          with open(".env", "w") as handle:
              for key in keys:
                  value = os.environ.get(key, "")
                  if value.strip() == "":
                      continue
                  handle.write(f"{key}={value}\n")
          PY

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "docker-compose.prod.yml,Makefile,.env"
          target: "/home/sbuild/spms-academic-hub"

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /home/sbuild/spms-academic-hub

            # Extract credentials from .env
            export GIT_USERNAME="$(grep -E '^GIT_USERNAME=' .env | cut -d= -f2-)"
            export GIT_PERSONAL_ACCESS_TOKEN="$(grep -E '^GIT_PERSONAL_ACCESS_TOKEN=' .env | cut -d= -f2-)"
            export BUILD_IMAGE="$(grep -E '^BUILD_IMAGE=' .env | cut -d= -f2-)"
            export BUILD_TAG="$(grep -E '^BUILD_TAG=' .env | cut -d= -f2-)"
            export DATABASE_URL="$(grep -E '^DATABASE_URL=' .env | cut -d= -f2-)"

            echo "Testing database connection..."
            # Extract host and port from DATABASE_URL for testing
            DB_HOST=$(echo $DATABASE_URL | sed -n 's/.*@\([^:]*\):.*/\1/p')
            DB_PORT=$(echo $DATABASE_URL | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
            echo "DB Host: $DB_HOST, DB Port: $DB_PORT"
            
            # Test if DB is reachable
            if nc -zv $DB_HOST $DB_PORT 2>&1 | grep -q succeeded; then
              echo "✓ Database is reachable"
            else
              echo "✗ Database is NOT reachable from production server"
              echo "Please check firewall rules and ensure the production server can access $DB_HOST:$DB_PORT"
              exit 1
            fi

            # Pull Docker image
            make build-image-pull

            # Start containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --pull always

            # Wait for containers to start
            sleep 10

            # Check container status
            docker compose -f docker-compose.prod.yml ps

            # Check API logs
            docker compose -f docker-compose.prod.yml logs --tail=50 api

            # Health check (retry up to 10 times, 10s each = 100 seconds)
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:8899/health >/dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              echo "Waiting for API to become healthy ($i/10)..."
              sleep 10
            done

            # Health check failed - show logs and exit
            echo "Health check failed after 10 attempts"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=100 api
            exit 1
